name: Загрузка моделей из DVC
description: Настройка доступа WebDAV и загрузка зафиксированного выпуска моделей
inputs:
  user:
    description: Логин аккаунта Яндекс
    required: true
  password:
    description: Пароль приложения Яндекс для WebDAV
    required: true
runs:
  using: composite
  steps:
    - name: Загрузка артефактов моделей
      shell: bash
      env:
        DVC_YANDEX_USER: ${{ inputs.user }}
        DVC_YANDEX_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        trap 'rm -f .dvc/config.local' EXIT
        python scripts/configure_dvc_yandex.py --from-env
        python -m dvc pull models
        python -m src.register_release models/current.json
