name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:

jobs:
  compose-functional-tests:
    name: Run Docker Compose functional tests
    # PR builds do not publish images. Only successful push/manual CI runs qualify.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # workflow_run's github.sha belongs to the default branch, not the tested commit.
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops_project
      COMPOSE_DISABLE_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bootstrap dependencies
        run: python -m pip install hvac==2.4.0
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Select exact tested image
        run: |
          cat > docker-compose.override.yml <<'YAML'
          services:
            diabetes-api:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
            kafka-consumer:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
          YAML
          docker compose pull diabetes-api kafka-consumer
      - name: Start isolated Vault and run functional checks
        run: >-
          python -m scripts.start_stack --ci --no-build --check
          --compose-file docker-compose.override.yml
      - name: Service diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100 diabetes-api kafka-consumer
      - name: Remove disposable test environment
        if: always()
        run: docker compose down -v
