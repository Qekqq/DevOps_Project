name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID успешного запуска CI для текущего main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-release:
    name: Проверка выпуска на временном окружении
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - name: Проверка происхождения выпуска и текущего main
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        with:
          script: |
            const runId = Number(process.env.REQUESTED_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Некорректный ID запуска CI');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (run.path !== '.github/workflows/ci.yml' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.head_sha !== branch.commit.sha) {
              throw new Error('Выкладывается только успешный CI текущего main');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(runId));
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Закрытая загрузка моделей проверяемого коммита
        env:
          DVC_YANDEX_USER: ${{ secrets.DVC_YANDEX_USER }}
          DVC_YANDEX_PASSWORD: ${{ secrets.DVC_YANDEX_PASSWORD }}
        run: python -m scripts.fetch_models
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.release.outputs.sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
      - name: Проверка пакета
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CI_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          python -c 'import os; from scripts.deploy_release import read_release; read_release("release", os.environ["RELEASE_SHA"], os.environ["CI_RUN_ID"])'
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Получение проверенных образов
        run: docker compose -f release/docker-compose.json pull
      - name: Сканирование всего выпуска перед запуском
        run: python -m scripts.scan_images --compose release/docker-compose.json
      - name: Отчёты безопасности выпуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ steps.release.outputs.sha }}
          path: .local-history/security-scans/**/report.json
          retention-days: 14
      - name: Запуск и интеграционные проверки
        run: python -m scripts.start_stack --ci --vault-tls --file-secrets --project devops_verify --no-build --check --release-dir release
      - name: Диагностика сервисов
        if: failure()
        run: |
          docker compose -p devops_verify -f release/docker-compose.json ps -a
          docker compose -p devops_verify -f release/docker-compose.json logs --tail=100 diabetes-api kafka-consumer metrics-exporter frontend docker-stats docker-proxy
      - name: Удаление только одноразового тестового окружения
        if: always()
        run: |
          if [ -f release/docker-compose.json ]; then
            docker compose -p devops_verify -f release/docker-compose.json down -v
          fi
          # Includes TLS/AppRole volumes from a partially completed bootstrap.
          docker volume ls -q --filter label=com.docker.compose.project=devops_verify | xargs -r docker volume rm

  deploy:
    name: Обновление постоянного приложения
    needs: verify-release
    runs-on: [self-hosted, Windows, X64, devops-production]
    timeout-minutes: 20
    environment: production
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - name: Проверка актуальности main перед выкладкой
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.sha }}
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.commit.sha !== process.env.RELEASE_SHA) throw new Error('main уже изменился; устаревшая выкладка остановлена');
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false
      - name: Проверка установленного Python без изменения Windows
        # Keep Windows PowerShell run blocks ASCII: runner writes UTF-8 without BOM.
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          if (-not $env:DEVOPS_DEPLOY_HOME) { throw 'Runner is not configured: DEVOPS_DEPLOY_HOME is missing' }
          $deploymentPython = $env:DEVOPS_PYTHON
          if (-not $deploymentPython) {
            $projectRoot = Split-Path (Split-Path $env:DEVOPS_DEPLOY_HOME -Parent) -Parent
            $deploymentPython = Join-Path $projectRoot '.venv\Scripts\python.exe'
          }
          if (-not (Test-Path -LiteralPath $deploymentPython -PathType Leaf)) {
            throw 'Python was not found. Restore .venv or set DEVOPS_PYTHON before starting the runner.'
          }
          & $deploymentPython -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11+ is required'; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python failed to start; deployment stopped.' }
          "DEPLOY_PYTHON=$deploymentPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Получение моделей из закрытого DVC-хранилища
        env:
          DVC_YANDEX_USER: ${{ secrets.DVC_YANDEX_USER }}
          DVC_YANDEX_PASSWORD: ${{ secrets.DVC_YANDEX_PASSWORD }}
        run: |
          & $env:DEPLOY_PYTHON -m scripts.fetch_models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.verify-release.outputs.sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release.outputs.run_id }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Проверка локальной готовности без обновления приложения
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.sha }}
          CI_RUN_ID: ${{ needs.verify-release.outputs.run_id }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          & $env:DEPLOY_PYTHON -m scripts.deploy_release --release release --commit $env:RELEASE_SHA --ci-run $env:CI_RUN_ID --preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Выкладка без локальной сборки
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.sha }}
          CI_RUN_ID: ${{ needs.verify-release.outputs.run_id }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          if (-not $env:DEVOPS_DEPLOY_HOME) { throw 'Runner is not configured: DEVOPS_DEPLOY_HOME is missing' }
          & $env:DEPLOY_PYTHON -m scripts.deploy_release --release release --commit $env:RELEASE_SHA --ci-run $env:CI_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Сохранение состава установленного выпуска для повторного сканирования
        uses: actions/upload-artifact@v4
        with:
          name: deployed-release
          path: |
            release/docker-compose.json
            release/release.json
          retention-days: 90
          if-no-files-found: error
