name: Scheduled image security
on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find latest successful deployment
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'cd.yml', branch:'main', status:'success', per_page:1});
            if (!data.workflow_runs.length) throw new Error('No successful deployment');
            core.setOutput('id', String(data.workflow_runs[0].id));
            core.setOutput('sha', data.workflow_runs[0].head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: deployed-release
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.id }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker compose -f release/docker-compose.json pull
      - id: image-scan
        run: python -m scripts.scan_images --compose release/docker-compose.json
      - uses: ./.github/actions/security-report
        if: always()
        with:
          name: scheduled-security-report
          scan-outcome: ${{ steps.image-scan.outcome }}
          retention-days: 30
