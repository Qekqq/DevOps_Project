name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops_project
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    name: Проверки проекта
    runs-on: ubuntu-latest
    # Секреты DVC недоступны для запросов из сторонних копий репозитория.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Получение кода проекта
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6

      - name: Проверка кода и схемы БД
        run: |
          python -m ruff check src scripts tests notebooks
          python -m ruff format --check src scripts tests notebooks
          python -m scripts.generate_schema --check

      - name: Загрузка выпуска моделей
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Модульные тесты
        run: |
          python -m pytest tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка синтаксиса JavaScript
        run: |
          node --check frontend/app.js
          for file in frontend/js/*.js; do node --check "$file"; done

  docker-build-and-push:
    name: Сборка и публикация Docker-образа
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Получение кода проекта
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Загрузка выпуска моделей
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Вход в Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и публикация Docker-образа
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Сборка и проверка frontend-контейнера
        run: |
          docker build --label "org.opencontainers.image.revision=$IMAGE_TAG" -t "$IMAGE_NAME-frontend:$IMAGE_TAG" ./frontend
          docker run --rm "$IMAGE_NAME-frontend:$IMAGE_TAG" nginx -t

      - name: Публикация frontend и подготовка пакета выкладки
        if: ${{ github.event_name != 'pull_request' }}
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
        run: |
          docker push "$IMAGE_NAME-frontend:$IMAGE_TAG"
          FRONTEND_IMAGE=$(docker image inspect "$IMAGE_NAME-frontend:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          python -m scripts.package_release --output release --commit "$IMAGE_TAG" --run-id "$GITHUB_RUN_ID" --api-image "$IMAGE_NAME@$API_DIGEST" --frontend-image "$FRONTEND_IMAGE"

      - name: Сохранение точных образов и настроек выпуска
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
