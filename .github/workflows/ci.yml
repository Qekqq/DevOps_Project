name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops_project
  IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Проверки проекта
    runs-on: ubuntu-latest
    # Секреты DVC недоступны для запросов из сторонних копий репозитория.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Получение кода проекта
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.6

      - name: Проверка кода и схемы БД
        run: |
          python -m ruff check src scripts tests notebooks
          python -m ruff format --check src scripts tests notebooks
          python -m scripts.generate_schema --check

      - name: Загрузка выпуска моделей
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Модульные тесты
        run: |
          python -m pytest tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка синтаксиса JavaScript
        run: |
          node --check frontend/app.js
          for file in frontend/js/*.js; do node --check "$file"; done

  docker-build-and-push:
    name: Сборка и публикация Docker-образа
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Получение кода проекта
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Загрузка выпуска моделей
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Вход в Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и публикация Docker-образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Сборка и проверка frontend-контейнера
        run: |
          docker build -t devops-frontend-check ./frontend
          docker run --rm devops-frontend-check nginx -t
