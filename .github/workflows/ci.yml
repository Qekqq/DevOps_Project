name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/qekqq/devops_project
  IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    # Private DVC credentials are unavailable to pull requests from forks.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model release
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Run unit tests
        run: |
          python -m pytest tests -v

  docker-build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore model release
        uses: ./.github/actions/pull-models
        with:
          user: ${{ secrets.DVC_YANDEX_USER }}
          password: ${{ secrets.DVC_YANDEX_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  cd:
    needs: docker-build-and-push
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ github.sha }}
