worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    server_tokens off;

    # Match the original request target, not a decoded/normalized path. All
    # archive, exec, logs, export, build, volume and mutation APIs stay denied.
    map "$request_method:$request_uri" $docker_read_allowed {
        default 0;
        ~^GET:/_ping$ 1;
        ~^HEAD:/(v[0-9]+\.[0-9]+/)?_ping$ 1;
        ~^GET:/(v[0-9]+\.[0-9]+/)?containers/json(\?.*)?$ 1;
        ~^GET:/containers/[a-f0-9]+/stats\?stream=false&one-shot=true$ 1;
    }
    server {
        listen 2375;
        location / {
            if ($docker_read_allowed = 0) { return 403; }
            proxy_pass http://unix:/var/run/docker.sock;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
