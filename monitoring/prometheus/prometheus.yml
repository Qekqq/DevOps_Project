global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
  - job_name: diabetes-api
    static_configs:
      - targets: ["diabetes-api:9101"]
        labels:
          service: api
  - job_name: diabetes-consumer
    static_configs:
      - targets: ["kafka-consumer:9101"]
        labels:
          service: consumer
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: diabetes-quality
    static_configs:
      - targets: ["metrics-exporter:9100"]
