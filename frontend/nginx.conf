limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_rate:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections:1m;

# Never log raw URI, query, IP, Referer, headers or request/response bodies.
map $uri $safe_route {
    default "other";
    ~^/api/auth/ "auth";
    ~^/api/predict$ "predict";
    ~^/api/studies "studies";
    ~^/api/ "api";
    ~^/grafana/ "monitoring";
    /healthz "health";
}
log_format safe escape=json '{"service":"frontend","action":"http_request",'
    '"route":"$safe_route","status":$status,"duration_s":$request_time}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    access_log /dev/stdout safe;
    # Nginx error messages may include full URLs; use the safe status log above.
    error_log /dev/null;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn connections 20;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location = /grafana {
        return 302 /grafana/;
    }

    location = /_monitoring_auth {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_api http://diabetes-api:8000;
        proxy_pass $auth_api/monitoring/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    location /grafana/ {
        client_max_body_size 2m;
        auth_request /_monitoring_auth;
        auth_request_set $monitoring_user $upstream_http_x_monitoring_user;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-WEBAUTH-USER $monitoring_user;
        # Доступ сюда разрешён только администраторам приложения.
        # Существующая роль Grafana сохраняется; новым пользователям назначается Editor.
        proxy_set_header X-WEBAUTH-ROLE "";
        proxy_set_header Authorization "";
        # Forward only the application session; never forward authorization headers.
        proxy_set_header Cookie "dp_session=$cookie_dp_session";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/auth/login {
        limit_req zone=login_rate burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://diabetes-api:8000;
        proxy_pass $api/auth/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_connect_timeout 5s;
        # Повторно разрешаем имя через Docker DNS после пересоздания API-контейнера.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://diabetes-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location ~ /\. {
        deny all;
    }
}
