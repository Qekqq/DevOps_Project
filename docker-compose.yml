name: devops_project

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
  pids_limit: 128
  shm_size: 64m

services:
  frontend:
    networks: [edge]
    <<: *runtime-security
    mem_limit: 128m
    cpus: 0.5
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      diabetes-api:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

  diabetes-api:
    networks: [edge, default, monitoring]
    <<: *runtime-security
    mem_limit: 768m
    cpus: 1.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      APP_SERVICE: api
      METRICS_PORT: "9101"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${API_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${API_VAULT_SECRET_ID:-}
      VAULT_KV_MOUNT: secret
      VAULT_DB_SECRET_PATH: ${API_VAULT_DB_SECRET_PATH:-database/postgres}
      VAULT_KAFKA_SECRET_PATH: kafka/config
    volumes:
      - ./models:/app/models:ro
      - ./data/feedback:/app/data/feedback
      - application_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  kafka-consumer:
    networks: [default, monitoring]
    <<: *runtime-security
    mem_limit: 512m
    cpus: 1.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      APP_SERVICE: consumer
      METRICS_PORT: "9101"
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${CONSUMER_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${CONSUMER_VAULT_SECRET_ID:-}
      VAULT_KV_MOUNT: secret
      VAULT_DB_SECRET_PATH: ${CONSUMER_VAULT_DB_SECRET_PATH:-database/postgres}
      VAULT_KAFKA_SECRET_PATH: kafka/config
    command: python -m src.kafka.consumer
    volumes:
      - ./models:/app/models:ro
      - application_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  metrics-exporter:
    networks: [default, monitoring]
    <<: *runtime-security
    build:
      context: .
    command: python -m src.metrics_exporter
    environment:
      APP_SERVICE: exporter
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${EXPORTER_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${EXPORTER_VAULT_SECRET_ID:-}
      VAULT_DB_SECRET_PATH: ${EXPORTER_VAULT_DB_SECRET_PATH:-database/metrics}
    volumes:
      - application_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    networks: [monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    image: ${PROMETHEUS_IMAGE:-devops-prometheus:local}
    build: ./monitoring/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - metrics-exporter
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  grafana:
    networks: [edge, monitoring]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    image: ${GRAFANA_IMAGE:-devops-grafana:local}
    build: ./monitoring/grafana
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped

  loki:
    networks: [monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    image: ${LOKI_IMAGE:-devops-loki:local}
    build: ./monitoring/loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  alloy:
    networks: [monitoring]
    user: "473:473"
    image: ${ALLOY_IMAGE:-devops-alloy:local}
    build: ./monitoring/alloy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-devops_project}
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - application_logs:/app/logs:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  docker-stats:
    <<: *runtime-security
    build: .
    networks: [monitoring, docker-observe]
    environment:
      APP_SERVICE: docker-stats
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-devops_project}
    command: python -m src.docker_metrics_exporter
    depends_on:
      docker-proxy:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    restart: unless-stopped

  docker-proxy:
    <<: *runtime-security
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
    networks: [docker-observe]
    user: "101:101"
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    entrypoint: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./monitoring/docker-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging
    restart: unless-stopped

  db:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    shm_size: 128m
    # Keep persistent infrastructure identical in CI and production.
    # Updating these digests requires a separate infrastructure upgrade.
    image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diabetes}
      POSTGRES_USER: ${POSTGRES_USER:-diabetes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    image: hashicorp/vault:1.17@sha256:74a4ab138ab5d64725e89cd9a9c73f7040c7fe49e98b71697b275ca9a69919df
    logging: *default-logging
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - ./vault/server.hcl:/vault/config/server.hcl:ro
    ports:
      - "127.0.0.1:8201:8200"
    command: server
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    image: bitnamilegacy/kafka:3.7@sha256:c274f870840a5d854fb601408c398e596c795582d869b5d85c7f7d882e5c478d
    logging: *default-logging
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

networks:
  default: {}
  edge: {}
  docker-observe:
    internal: true
  monitoring:
    internal: true

volumes:
  pgdata:
  kafka_data:
  vault_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  application_logs:
