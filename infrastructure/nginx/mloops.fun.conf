# Host Nginx: TLS terminates here; the frontend listens only on loopback.
server {
    listen 80;
    listen [::]:80;
    server_name mloops.fun;
    server_tokens off;
    access_log off;
    return 301 https://mloops.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mloops.fun;
    server_tokens off;
    access_log off;
    # Request URLs can contain sensitive parameters.
    error_log /dev/null;

    ssl_certificate /etc/letsencrypt/live/mloops.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mloops.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host mloops.fun;
        # Replace client-supplied forwarding headers at the public boundary.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_redirect http://mloops.fun/ https://mloops.fun/;
    }
}
